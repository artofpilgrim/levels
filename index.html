<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Levels — texture alpha studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: oklch(0.16 0.006 80);
    --panel: oklch(0.20 0.006 80);
    --panel-2: oklch(0.235 0.006 80);
    --line: oklch(0.30 0.006 80);
    --line-soft: oklch(0.26 0.006 80);
    --fg: oklch(0.96 0.004 80);
    --fg-2: oklch(0.80 0.005 80);
    --fg-3: oklch(0.62 0.006 80);
    --accent: oklch(0.78 0.13 65);
    --accent-2: oklch(0.85 0.10 65);
    --danger: oklch(0.72 0.15 30);
    --radius: 6px;
    --gap: 14px;
  }
  *{ box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 "Geist", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  button { font: inherit; color: inherit; }

  /* App shell */
  .app{
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 44px 1fr;
    height: 100vh;
  }
  header{
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-mark{
    width: 22px; height: 22px;
    border-radius: 4px;
    background:
      linear-gradient(180deg, transparent 0%, transparent 50%, oklch(0.96 0.004 80) 50%, oklch(0.96 0.004 80) 100%),
      linear-gradient(90deg, oklch(0.20 0.006 80), oklch(0.20 0.006 80));
    border: 1px solid var(--line);
  }
  .brand-sub{
    color: var(--fg-3);
    font-weight: 400;
    margin-left: 4px;
    font-size: 12px;
  }
  .header-actions{
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .btn{
    height: 30px;
    padding: 0 12px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    transition: background .12s, border-color .12s, transform .05s;
  }
  .btn:hover{ background: oklch(0.27 0.006 80); border-color: oklch(0.38 0.006 80); }
  .btn:active{ transform: translateY(1px); }
  .btn[disabled]{ opacity: .4; cursor: not-allowed; }
  .btn.primary{
    background: var(--accent);
    color: oklch(0.16 0.006 80);
    border-color: transparent;
    font-weight: 500;
  }
  .btn.primary:hover{ background: var(--accent-2); }
  .btn .kbd{
    color: var(--fg-3);
    font-size: 11px;
    margin-left: 4px;
    font-family: "Geist Mono", monospace;
  }
  .btn.primary .kbd{ color: oklch(0.16 0.006 80 / 0.55); }
  .icon{ width: 14px; height: 14px; }

  /* Canvas area */
  .stage{
    position: relative;
    background:
      linear-gradient(45deg, oklch(0.18 0.006 80) 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, oklch(0.18 0.006 80) 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, oklch(0.18 0.006 80) 75%) 0 8px/16px 16px,
      linear-gradient(-45deg, transparent 75%, oklch(0.18 0.006 80) 75%) 0 8px/16px 16px,
      oklch(0.14 0.006 80);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .canvas-wrap{
    position: relative;
    display: inline-block;
    max-width: calc(100% - 48px);
    max-height: calc(100% - 48px);
    line-height: 0;
  }
  .canvas-wrap canvas{
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 44px - 48px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px oklch(0.10 0.006 80);
    image-rendering: pixelated;
  }
  .canvas-wrap canvas.fit-smooth{ image-rendering: auto; }

  .crop-overlay{
    position: absolute;
    inset: 0;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
    touch-action: none;
  }
  .crop-rect{
    position: absolute;
    border: 1px solid oklch(0.96 0.004 80);
    box-shadow: 0 0 0 99999px oklch(0.08 0.006 80 / 0.55);
    pointer-events: none;
  }
  .crop-rect::before,
  .crop-rect::after{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to right, oklch(0.40 0.006 80 / 0.5) 1px, transparent 1px) 33.33% 0/33.33% 100%,
      linear-gradient(to right, oklch(0.40 0.006 80 / 0.5) 1px, transparent 1px) 66.66% 0/33.33% 100%,
      linear-gradient(to bottom, oklch(0.40 0.006 80 / 0.5) 1px, transparent 1px) 0 33.33%/100% 33.33%,
      linear-gradient(to bottom, oklch(0.40 0.006 80 / 0.5) 1px, transparent 1px) 0 66.66%/100% 33.33%;
  }
  .crop-rect.empty{ box-shadow: 0 0 0 99999px oklch(0.08 0.006 80 / 0.55); border-color: transparent; }
  .crop-empty-msg{
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: var(--fg-2);
    font-size: 12.5px;
    background: oklch(0.16 0.006 80 / 0.85);
    padding: 6px 10px;
    border-radius: 4px;
    pointer-events: none;
    letter-spacing: 0.01em;
  }

  .perspective-overlay{
    position: absolute;
    inset: 0;
    pointer-events: none;
    user-select: none;
    touch-action: none;
  }
  .perspective-svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .quad-handle{
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: oklch(0.96 0.004 80);
    border: 1.5px solid oklch(0.16 0.006 80);
    box-shadow: 0 0 0 1px oklch(0.40 0.006 80), 0 2px 6px rgba(0,0,0,.5);
    transform: translate(-50%, -50%);
    cursor: grab;
    pointer-events: auto;
    touch-action: none;
  }
  .quad-handle:hover{ background: var(--accent); }
  .quad-handle:active{ cursor: grabbing; background: var(--accent); }

  .stage-processing{
    position: absolute;
    inset: 0;
    background: oklch(0.10 0.006 80 / 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: auto;
  }
  .stage-processing-inner{
    background: oklch(0.20 0.006 80);
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .aspect-select{
    height: 26px;
    background: transparent;
    color: var(--fg);
    border: 0;
    border-radius: 4px;
    padding: 0 6px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--fg-2) 50%), linear-gradient(-45deg, transparent 50%, var(--fg-2) 50%);
    background-position: calc(100% - 9px) 50%, calc(100% - 5px) 50%;
    background-size: 4px 4px;
    background-repeat: no-repeat;
    padding-right: 18px;
  }
  .aspect-select:hover{ background-color: oklch(0.30 0.006 80 / 0.5); }
  .aspect-select option{ background: var(--panel); color: var(--fg); }

  .empty{
    position: absolute;
    inset: 24px;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--fg-2);
    background: oklch(0.16 0.006 80 / 0.7);
    transition: border-color .15s, background .15s;
  }
  .empty.drag{
    border-color: var(--accent);
    background: oklch(0.78 0.13 65 / 0.08);
  }
  .empty h2{
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .empty p{
    margin: 0;
    color: var(--fg-3);
    font-size: 12.5px;
  }
  .empty .glyph{
    width: 56px; height: 56px;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    background: var(--panel);
    color: var(--fg-2);
  }
  .empty .actions{
    display: flex; gap: 8px; margin-top: 4px;
  }
  .empty .hint{
    position: absolute;
    bottom: 18px;
    color: var(--fg-3);
    font-size: 11.5px;
  }

  .stage-overlay{
    position: absolute;
    top: 12px; left: 12px;
    display: flex; gap: 6px;
    pointer-events: none;
  }
  .chip{
    background: oklch(0.16 0.006 80 / 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(0.40 0.006 80 / 0.4);
    color: var(--fg-2);
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: auto;
    font-family: "Geist Mono", monospace;
  }
  .stage-controls{
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 4px;
    background: oklch(0.16 0.006 80 / 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(0.40 0.006 80 / 0.4);
    padding: 4px;
    border-radius: 7px;
  }
  .toggle-btn{
    height: 26px;
    padding: 0 10px;
    background: transparent;
    border: 0;
    color: var(--fg-2);
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .toggle-btn:hover{ background: oklch(0.30 0.006 80 / 0.5); color: var(--fg); }
  .toggle-btn.on{ background: oklch(0.30 0.006 80); color: var(--fg); }
  .toggle-btn.held{ background: var(--accent); color: oklch(0.16 0.006 80); }

  /* Sidebar */
  aside{
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex; flex-direction: column;
  }
  aside::-webkit-scrollbar{ width: 8px; }
  aside::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  section.panel{
    border-bottom: 1px solid var(--line);
  }
  .panel-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
  }
  .panel-head .title{
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-2);
    font-weight: 500;
  }
  .panel-head .meta{
    color: var(--fg-3);
    font-size: 11px;
  }
  .panel-body{
    padding: 4px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .reset-link{
    background: none;
    border: 0;
    color: var(--fg-3);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .reset-link:hover{ color: var(--fg); background: var(--panel-2); }

  /* Sliders */
  .row{
    display: grid;
    grid-template-columns: 64px 1fr 78px;
    align-items: center;
    gap: 10px;
  }
  .row .label{
    color: var(--fg-2);
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .row .label .swatch{
    width: 9px; height: 9px; border-radius: 2px;
    border: 1px solid oklch(0 0 0 / 0.3);
  }
  .row input[type=number]{
    height: 24px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 4px;
    text-align: right;
    padding: 0 6px;
    font-family: "Geist Mono", monospace;
    font-size: 11.5px;
    width: 100%;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .row input[type=number]:focus{ outline: 1px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row input[type=number]::-webkit-outer-spin-button,
  .row input[type=number]::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; display: none; }

  .slider-track{
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .slider-track .rail{
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--rail-from, oklch(0.30 0.006 80)) 0%, var(--rail-to, oklch(0.55 0.006 80)) 100%);
    position: relative;
  }
  .slider-track .rail.signed::before{
    content:"";
    position: absolute;
    left: 50%; top: -3px; bottom: -3px;
    width: 1px;
    background: oklch(0.45 0.006 80);
  }
  .slider-track .thumb{
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: 2px solid oklch(0.16 0.006 80);
    box-shadow: 0 0 0 1px oklch(0.40 0.006 80), 0 1px 4px rgba(0,0,0,.4);
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* Levels histogram + handles */
  .levels-graph{
    position: relative;
    height: 84px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .levels-graph canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .levels-axis{
    position: relative;
    height: 26px;
    background: linear-gradient(90deg, #000 0%, #fff 100%);
    border-radius: 3px;
    margin-top: 6px;
    cursor: pointer;
    user-select: none;
  }
  .levels-axis .handle{
    position: absolute;
    bottom: -6px;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 9px solid var(--c);
    transform: translateX(-50%);
    cursor: ew-resize;
    filter: drop-shadow(0 0 1px rgba(0,0,0,0.6));
  }
  .levels-axis .handle.shadow{ --c: #111; }
  .levels-axis .handle.midtone{ --c: #888; }
  .levels-axis .handle.highlight{ --c: #fff; }
  .levels-output{
    position: relative;
    height: 10px;
    background: linear-gradient(90deg, #000 0%, #fff 100%);
    border-radius: 3px;
    margin-top: 18px;
    cursor: pointer;
    user-select: none;
  }
  .levels-output .handle{
    position: absolute;
    top: 50%;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c);
    border: 1.5px solid oklch(0.20 0.006 80);
    box-shadow: 0 0 0 1px oklch(0.40 0.006 80);
    transform: translate(-50%, -50%);
    cursor: ew-resize;
  }
  .levels-output .handle.out-shadow{ --c: #111; }
  .levels-output .handle.out-highlight{ --c: #fff; }

  .levels-values{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }
  .levels-values .v{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 6px;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    text-align: center;
    color: var(--fg);
  }
  .levels-values .v .lab{
    color: var(--fg-3);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 2px;
  }
  .levels-values input{
    background: transparent;
    border: 0;
    color: var(--fg);
    width: 100%;
    text-align: center;
    font-family: inherit;
    font-size: 11px;
    padding: 0;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .levels-values input::-webkit-outer-spin-button,
  .levels-values input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; display: none; }
  .levels-values input:focus{ outline: 1px solid var(--accent); border-radius: 2px; }

  .stepper{
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .stepper input{ flex: 1; min-width: 0; }
  .step-btn{
    background: transparent;
    border: 0;
    padding: 0;
    width: 14px;
    height: 16px;
    border-radius: 3px;
    color: var(--fg-3);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
    flex: 0 0 auto;
    transition: opacity .12s, color .12s, background .12s;
  }
  .step-btn svg{ display: block; }
  .levels-values .v:hover .step-btn{ opacity: 1; }
  .step-btn:hover{ color: var(--fg); background: oklch(0.30 0.006 80); }
  .step-btn:active{ color: var(--accent); background: oklch(0.34 0.006 80); }
  .step-btn[disabled]{ opacity: 0.2; cursor: not-allowed; }
  .step-btn[disabled]:hover{ background: transparent; color: var(--fg-3); }
  .step-btn:focus-visible{ outline: 1px solid var(--accent); outline-offset: 1px; }

  /* Stepper variant inside a .row: unified bordered control */
  .row .stepper{
    height: 24px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    gap: 0;
    overflow: hidden;
  }
  .row .stepper:focus-within{
    outline: 1px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }
  .row .stepper input[type=number]{
    height: 100%;
    background: transparent;
    border: 0;
    border-radius: 0;
    text-align: right;
    padding: 0 4px;
    min-width: 0;
    width: auto;
  }
  .row .stepper input[type=number]:focus{ outline: 0; }
  .row .step-btn{
    height: 100%;
    width: 16px;
    border-radius: 0;
    opacity: 0.55;
  }
  .row:hover .step-btn,
  .row .stepper:focus-within .step-btn{ opacity: 1; }
  .row .step-btn:hover{ background: oklch(0.30 0.006 80); color: var(--fg); }
  .row .step-btn[disabled]{ opacity: 0.2; cursor: not-allowed; }

  .sublabel{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-3);
    margin-top: 4px;
  }

  /* Preset row */
  .presets{
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .preset{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--fg-2);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    cursor: pointer;
  }
  .preset:hover{ color: var(--fg); border-color: oklch(0.40 0.006 80); }
  .preset.active{ background: oklch(0.78 0.13 65 / 0.18); color: var(--accent-2); border-color: oklch(0.78 0.13 65 / 0.5); }

  /* Toggles & misc */
  .switch{
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 12px; color: var(--fg-2);
  }
  .switch input{ display: none; }
  .switch .track{
    width: 26px; height: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    position: relative;
    transition: background .15s;
  }
  .switch .track::after{
    content: "";
    position: absolute;
    width: 10px; height: 10px;
    background: var(--fg-2);
    border-radius: 50%;
    top: 1px; left: 1px;
    transition: left .15s, background .15s;
  }
  .switch input:checked + .track{ background: var(--accent); border-color: transparent; }
  .switch input:checked + .track::after{ left: 14px; background: oklch(0.16 0.006 80); }

  .toast{
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: oklch(0.96 0.004 80);
    color: oklch(0.16 0.006 80);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    opacity: 0;
    transition: transform .2s, opacity .2s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error{ background: var(--danger); color: oklch(0.16 0.006 80); }

  .file-input{ display: none; }

  /* Narrow / mobile viewports */
  @media (max-width: 720px) {
    body{ overflow: auto; }
    .app{
      grid-template-columns: 1fr;
      grid-template-rows: 44px minmax(50vh, auto) auto;
      height: auto;
      min-height: 100vh;
    }
    aside{
      width: auto;
      border-left: 0;
      border-top: 1px solid var(--line);
      overflow-y: visible;
    }
    .header-actions .btn .kbd{ display: none; }
    .header-actions{ gap: 6px; }
    .header-actions .btn{ padding: 0 9px; }
    .stage{ min-height: 50vh; }
    .canvas-wrap canvas{
      max-height: calc(100vh - 44px - 80px);
    }
    .stage-controls{
      flex-wrap: wrap;
      max-width: calc(100% - 24px);
      justify-content: center;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
(function () {
  const { useState, useEffect, useRef, useCallback, useMemo } = React;
  const h = React.createElement;

  /* Image processing ────────────────────────────────────────── */

  function bwGrayLookup(r, g, b, w) {
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const sub = max - min;
    if (sub === 0) return max;

    let weight;
    if (r === max) {
      if (b <= g) {
        const t = (g - min) / sub;
        weight = w.r + (w.y - w.r) * t;
      } else {
        const t = (b - min) / sub;
        weight = w.r + (w.m - w.r) * t;
      }
    } else if (g === max) {
      if (r >= b) {
        const t = (max - r) / sub;
        weight = w.y + (w.g - w.y) * t;
      } else {
        const t = (b - min) / sub;
        weight = w.g + (w.c - w.g) * t;
      }
    } else {
      if (g >= r) {
        const t = (max - g) / sub;
        weight = w.c + (w.b - w.c) * t;
      } else {
        const t = (r - min) / sub;
        weight = w.b + (w.m - w.b) * t;
      }
    }
    return max - sub * (1 - weight);
  }

  function buildLevelsLUT(black, white, gamma, oBlack, oWhite, invert, brightness, contrast) {
    const lut = new Uint8ClampedArray(256);
    const denom = Math.max(1, white - black);
    const invGamma = 1 / Math.max(0.01, gamma);
    const cFactor = 1 + (contrast || 0) / 100;
    const bOffset = brightness || 0;
    for (let i = 0; i < 256; i++) {
      let pre = (i - 128) * cFactor + 128 + bOffset;
      pre = Math.max(0, Math.min(255, pre));
      let v = (pre - black) / denom;
      v = Math.max(0, Math.min(1, v));
      v = Math.pow(v, invGamma);
      v = oBlack + v * (oWhite - oBlack);
      if (invert) v = 255 - v;
      lut[i] = Math.round(v);
    }
    return lut;
  }

  function processImage(srcImageData, settings) {
    const { width, height, data: src } = srcImageData;
    const out = new ImageData(width, height);
    const dst = out.data;

    const w = {
      r: settings.bw.r / 100,
      y: settings.bw.y / 100,
      g: settings.bw.g / 100,
      c: settings.bw.c / 100,
      b: settings.bw.b / 100,
      m: settings.bw.m / 100,
    };
    const lut = buildLevelsLUT(
      settings.levels.inBlack,
      settings.levels.inWhite,
      settings.levels.gamma,
      settings.levels.outBlack,
      settings.levels.outWhite,
      settings.invert,
      settings.bc.brightness,
      settings.bc.contrast
    );

    for (let i = 0; i < src.length; i += 4) {
      let gray;
      if (settings.bwOn) {
        gray = bwGrayLookup(src[i], src[i + 1], src[i + 2], w);
      } else {
        gray = 0.2126 * src[i] + 0.7152 * src[i + 1] + 0.0722 * src[i + 2];
      }
      const v = lut[Math.max(0, Math.min(255, Math.round(gray)))];
      dst[i] = v;
      dst[i + 1] = v;
      dst[i + 2] = v;
      dst[i + 3] = src[i + 3];
    }
    return out;
  }

  /* Perspective warp ────────────────────────────────────────── */

  function solveLinear(A, b) {
    const n = A.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let i = 0; i < n; i++) {
      let maxR = i;
      for (let k = i + 1; k < n; k++) {
        if (Math.abs(M[k][i]) > Math.abs(M[maxR][i])) maxR = k;
      }
      const tmp = M[i]; M[i] = M[maxR]; M[maxR] = tmp;
      const piv = M[i][i];
      if (Math.abs(piv) < 1e-12) return null;
      for (let k = i + 1; k < n; k++) {
        const f = M[k][i] / piv;
        for (let j = i; j <= n; j++) M[k][j] -= f * M[i][j];
      }
    }
    const x = new Array(n);
    for (let i = n - 1; i >= 0; i--) {
      let s = M[i][n];
      for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j];
      x[i] = s / M[i][i];
    }
    return x;
  }

  function computeHomography(srcPts, dstPts) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const xs = srcPts[i].x, ys = srcPts[i].y;
      const xd = dstPts[i].x, yd = dstPts[i].y;
      A.push([xs, ys, 1, 0, 0, 0, -xs * xd, -ys * xd]);
      b.push(xd);
      A.push([0, 0, 0, xs, ys, 1, -xs * yd, -ys * yd]);
      b.push(yd);
    }
    const h = solveLinear(A, b);
    if (!h) return null;
    return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
  }

  function quadOutSize(quad) {
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const topW = d(quad[0], quad[1]);
    const bottomW = d(quad[3], quad[2]);
    const leftH = d(quad[0], quad[3]);
    const rightH = d(quad[1], quad[2]);
    return { w: Math.max(8, Math.round(Math.max(topW, bottomW))), h: Math.max(8, Math.round(Math.max(leftH, rightH))) };
  }

  function warpPerspective(srcImageData, srcQuad, outW, outH) {
    const dstQuad = [
      { x: 0, y: 0 },
      { x: outW, y: 0 },
      { x: outW, y: outH },
      { x: 0, y: outH },
    ];
    const H = computeHomography(dstQuad, srcQuad);
    if (!H) return null;
    const srcW = srcImageData.width, srcH = srcImageData.height;
    const srcData = srcImageData.data;
    const out = new ImageData(outW, outH);
    const dstData = out.data;
    for (let y = 0; y < outH; y++) {
      const yh1 = H[1] * y + H[2];
      const yh4 = H[4] * y + H[5];
      const yh7 = H[7] * y + H[8];
      for (let x = 0; x < outW; x++) {
        const w = H[6] * x + yh7;
        const sx = (H[0] * x + yh1) / w;
        const sy = (H[3] * x + yh4) / w;
        const di = (y * outW + x) * 4;
        if (sx >= 0 && sy >= 0 && sx < srcW - 1 && sy < srcH - 1) {
          const x0 = sx | 0, y0 = sy | 0;
          const fx = sx - x0, fy = sy - y0;
          const i00 = (y0 * srcW + x0) * 4;
          const i10 = i00 + 4;
          const i01 = i00 + srcW * 4;
          const i11 = i01 + 4;
          const w00 = (1 - fx) * (1 - fy);
          const w10 = fx * (1 - fy);
          const w01 = (1 - fx) * fy;
          const w11 = fx * fy;
          dstData[di]     = srcData[i00]     * w00 + srcData[i10]     * w10 + srcData[i01]     * w01 + srcData[i11]     * w11;
          dstData[di + 1] = srcData[i00 + 1] * w00 + srcData[i10 + 1] * w10 + srcData[i01 + 1] * w01 + srcData[i11 + 1] * w11;
          dstData[di + 2] = srcData[i00 + 2] * w00 + srcData[i10 + 2] * w10 + srcData[i01 + 2] * w01 + srcData[i11 + 2] * w11;
          dstData[di + 3] = srcData[i00 + 3] * w00 + srcData[i10 + 3] * w10 + srcData[i01 + 3] * w01 + srcData[i11 + 3] * w11;
        } else {
          dstData[di + 3] = 0;
        }
      }
    }
    return out;
  }

  /* Defaults & presets ──────────────────────────────────────── */

  const DEFAULT_BW = { r: 40, y: 60, g: 40, c: 60, b: 20, m: 80 };
  const DEFAULT_BC = { brightness: 0, contrast: 0 };
  const DEFAULT_LEVELS = { inBlack: 0, inWhite: 255, gamma: 1.0, outBlack: 0, outWhite: 255 };
  const DEFAULT_SETTINGS = {
    bw: Object.assign({}, DEFAULT_BW),
    bc: Object.assign({}, DEFAULT_BC),
    levels: Object.assign({}, DEFAULT_LEVELS),
    bwOn: true,
    invert: false,
  };

  const BW_PRESETS = {
    "Default":        { r: 40,  y: 60,  g: 40,  c: 60,  b: 20,  m: 80  },
    "High contrast":  { r: 80,  y: 80,  g: 80,  c: 20,  b: 20,  m: 80  },
    "Dark sky":       { r: 40,  y: 60,  g: 40,  c: 60,  b: -50, m: 80  },
    "Infrared":       { r: -50, y: 250, g: 200, c: 60,  b: 0,   m: 50  },
    "Red filter":     { r: 120, y: 110, g: 40,  c: 20,  b: 20,  m: 90  },
    "Stark grunge":   { r: 70,  y: 30,  g: 30,  c: 70,  b: 100, m: 30  },
  };

  /* Helpers ─────────────────────────────────────────────────── */

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function Slider(props) {
    const { value, onChange, min = 0, max = 100, step = 1, gradientFrom, gradientTo, signed = false, defaultValue } = props;
    const trackRef = useRef(null);
    const updateFromEvent = (e) => {
      const r = trackRef.current.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      let t = clamp(x / r.width, 0, 1);
      let v = min + t * (max - min);
      v = Math.round(v / step) * step;
      onChange(v);
    };
    const onPointerDown = (e) => {
      e.preventDefault();
      updateFromEvent(e);
      const move = (ev) => updateFromEvent(ev);
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    };
    const onDouble = () => { if (defaultValue !== undefined) onChange(defaultValue); };
    const pct = ((value - min) / (max - min)) * 100;
    return h("div", {
      className: "slider-track",
      ref: trackRef,
      onPointerDown,
      onDoubleClick: onDouble,
      style: { "--rail-from": gradientFrom, "--rail-to": gradientTo },
    },
      h("div", { className: "rail" + (signed ? " signed" : "") }),
      h("div", { className: "thumb", style: { left: clamp(pct, 0, 100) + "%" } })
    );
  }

  function NumberInput(props) {
    const { value, onChange, min, max, step = 1, stepper = false } = props;
    const [local, setLocal] = useState(String(value));
    useEffect(() => { setLocal(String(value)); }, [value]);
    const commit = () => {
      let v = parseFloat(local);
      if (Number.isFinite(v)) {
        if (min !== undefined) v = Math.max(min, v);
        if (max !== undefined) v = Math.min(max, v);
        onChange(v);
      } else {
        setLocal(String(value));
      }
    };
    const stepBy = (dir) => {
      const decimals = (String(step).split(".")[1] || "").length;
      let base = parseFloat(local);
      if (!Number.isFinite(base)) base = value;
      let v = base + dir * step;
      if (min !== undefined) v = Math.max(min, v);
      if (max !== undefined) v = Math.min(max, v);
      if (decimals > 0) v = parseFloat(v.toFixed(decimals));
      onChange(v);
    };
    const inputEl = h("input", {
      type: "number",
      value: local,
      step,
      onChange: (e) => setLocal(e.target.value),
      onBlur: commit,
      onKeyDown: (e) => { if (e.key === "Enter") e.currentTarget.blur(); },
    });
    if (!stepper) return inputEl;
    const chev = (dir) => h("svg", { viewBox: "0 0 10 10", width: 10, height: 10, "aria-hidden": "true" },
      h("path", {
        d: dir < 0 ? "M6 2 L3 5 L6 8" : "M4 2 L7 5 L4 8",
        fill: "none", stroke: "currentColor", strokeWidth: 1.5,
        strokeLinecap: "round", strokeLinejoin: "round",
      })
    );
    const atMin = min !== undefined && value <= min;
    const atMax = max !== undefined && value >= max;
    return h("div", { className: "stepper" },
      h("button", {
        type: "button", className: "step-btn", tabIndex: -1,
        disabled: atMin, "aria-label": "Decrease",
        onClick: () => stepBy(-1),
      }, chev(-1)),
      inputEl,
      h("button", {
        type: "button", className: "step-btn", tabIndex: -1,
        disabled: atMax, "aria-label": "Increase",
        onClick: () => stepBy(1),
      }, chev(1))
    );
  }

  /* B&W mixer panel ─────────────────────────────────────────── */

  const BW_ROWS = [
    { key: "r", label: "Reds",     sw: "#e2483b", from: "oklch(0.30 0.13 25)",  to: "oklch(0.70 0.21 25)"  },
    { key: "y", label: "Yellows",  sw: "#e6c83b", from: "oklch(0.40 0.10 100)", to: "oklch(0.92 0.18 100)" },
    { key: "g", label: "Greens",   sw: "#46c451", from: "oklch(0.30 0.10 145)", to: "oklch(0.78 0.22 145)" },
    { key: "c", label: "Cyans",    sw: "#34c5d6", from: "oklch(0.30 0.06 215)", to: "oklch(0.85 0.13 215)" },
    { key: "b", label: "Blues",    sw: "#3b6de2", from: "oklch(0.20 0.10 265)", to: "oklch(0.55 0.22 265)" },
    { key: "m", label: "Magentas", sw: "#d646b8", from: "oklch(0.30 0.13 330)", to: "oklch(0.70 0.25 330)" },
  ];

  function BWMixer(props) {
    const { bw, bwOn, onChange, onToggle, onReset, preset, onPreset } = props;
    return h("section", { className: "panel" },
      h("div", { className: "panel-head" },
        h("span", { className: "title" }, "Channel mixer"),
        h("span", { style: { display: "flex", gap: 8, alignItems: "center" } },
          h("label", { className: "switch" },
            h("input", { type: "checkbox", checked: bwOn, onChange: (e) => onToggle(e.target.checked) }),
            h("span", { className: "track" })
          ),
          h("button", { className: "reset-link", onClick: onReset }, "Reset")
        )
      ),
      h("div", { className: "panel-body", style: { opacity: bwOn ? 1 : 0.5, pointerEvents: bwOn ? "auto" : "none" } },
        h("div", { className: "presets" },
          Object.keys(BW_PRESETS).map((name) =>
            h("button", {
              key: name,
              className: "preset" + (preset === name ? " active" : ""),
              onClick: () => onPreset(name),
            }, name)
          )
        ),
        BW_ROWS.map((row) =>
          h("div", { className: "row", key: row.key },
            h("span", { className: "label" },
              h("span", { className: "swatch", style: { background: row.sw } }),
              row.label
            ),
            h(Slider, {
              value: bw[row.key],
              onChange: (v) => onChange(Object.assign({}, bw, { [row.key]: v })),
              min: -200, max: 300, step: 1, signed: true,
              gradientFrom: row.from, gradientTo: row.to,
              defaultValue: DEFAULT_BW[row.key],
            }),
            h(NumberInput, {
              value: bw[row.key],
              min: -200, max: 300,
              stepper: true,
              onChange: (v) => onChange(Object.assign({}, bw, { [row.key]: v })),
            })
          )
        )
      )
    );
  }

  /* Brightness / Contrast panel ─────────────────────────────── */

  function BCPanel(props) {
    const { bc, onChange, onReset } = props;
    const row = (key, label, from, to) =>
      h("div", { className: "row", key },
        h("span", { className: "label" }, label),
        h(Slider, {
          value: bc[key],
          onChange: (v) => onChange(Object.assign({}, bc, { [key]: v })),
          min: -100, max: 100, step: 1, signed: true,
          gradientFrom: from, gradientTo: to,
          defaultValue: 0,
        }),
        h(NumberInput, {
          value: bc[key], min: -100, max: 100, stepper: true,
          onChange: (v) => onChange(Object.assign({}, bc, { [key]: v })),
        })
      );
    return h("section", { className: "panel" },
      h("div", { className: "panel-head" },
        h("span", { className: "title" }, "Brightness / Contrast"),
        h("button", { className: "reset-link", onClick: onReset }, "Reset")
      ),
      h("div", { className: "panel-body" },
        row("brightness", "Brightness", "oklch(0.20 0.006 80)", "oklch(0.92 0.004 80)"),
        row("contrast",   "Contrast",   "oklch(0.50 0.006 80)", "oklch(0.78 0.13 65)")
      )
    );
  }

  /* Levels panel ────────────────────────────────────────────── */

  function LevelsPanel(props) {
    const { levels, onChange, onReset, histogram } = props;
    const histCanvasRef = useRef(null);
    const inputRailRef = useRef(null);
    const outputRailRef = useRef(null);

    useEffect(() => {
      const c = histCanvasRef.current;
      if (!c || !histogram) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      c.width = rect.width * dpr;
      c.height = rect.height * dpr;
      const ctx = c.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, rect.width, rect.height);

      const max = Math.max.apply(null, histogram);
      if (max === 0) return;
      const bin = rect.width / 256;
      ctx.fillStyle = "oklch(0.55 0.006 80)";
      for (let i = 0; i < 256; i++) {
        const hh = Math.pow(histogram[i] / max, 0.5) * rect.height;
        ctx.fillRect(i * bin, rect.height - hh, bin + 0.5, hh);
      }
      ctx.fillStyle = "oklch(0.16 0.006 80 / 0.55)";
      ctx.fillRect(0, 0, (levels.inBlack / 255) * rect.width, rect.height);
      ctx.fillRect((levels.inWhite / 255) * rect.width, 0, rect.width, rect.height);
    }, [histogram, levels.inBlack, levels.inWhite]);

    const dragHandle = (railRef, setter, min, max) => (e) => {
      e.preventDefault();
      const rail = railRef.current;
      const update = (ev) => {
        const r = rail.getBoundingClientRect();
        const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        let v = clamp(Math.round((x / r.width) * 255), min, max);
        setter(v);
      };
      update(e);
      const move = (ev) => update(ev);
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    };

    const gammaPos = useMemo(() => {
      const t = (Math.log(levels.gamma) - Math.log(0.01)) / (Math.log(9.99) - Math.log(0.01));
      const f = 1 - t;
      return levels.inBlack + (levels.inWhite - levels.inBlack) * f;
    }, [levels.gamma, levels.inBlack, levels.inWhite]);

    const setBlack = (v) => {
      const nb = Math.min(v, levels.inWhite - 1);
      onChange(Object.assign({}, levels, { inBlack: nb }));
    };
    const setWhite = (v) => {
      const nw = Math.max(v, levels.inBlack + 1);
      onChange(Object.assign({}, levels, { inWhite: nw }));
    };
    const setGammaFromPos = (pos) => {
      const span = Math.max(1, levels.inWhite - levels.inBlack);
      let f = (pos - levels.inBlack) / span;
      f = clamp(f, 0.001, 0.999);
      const t = 1 - f;
      const logG = Math.log(0.01) + t * (Math.log(9.99) - Math.log(0.01));
      const g = Math.exp(logG);
      onChange(Object.assign({}, levels, { gamma: Math.round(g * 100) / 100 }));
    };

    return h("section", { className: "panel" },
      h("div", { className: "panel-head" },
        h("span", { className: "title" }, "Levels"),
        h("button", { className: "reset-link", onClick: onReset }, "Reset")
      ),
      h("div", { className: "panel-body" },
        h("div", { className: "sublabel" }, "Input"),
        h("div", { className: "levels-graph" },
          h("canvas", { ref: histCanvasRef })
        ),
        h("div", {
          className: "levels-axis",
          ref: inputRailRef,
          onPointerDown: (e) => {
            const r = inputRailRef.current.getBoundingClientRect();
            const x = e.clientX - r.left;
            const positions = [
              { key: "shadow", pos: (levels.inBlack / 255) * r.width },
              { key: "mid",    pos: (gammaPos / 255) * r.width },
              { key: "high",   pos: (levels.inWhite / 255) * r.width },
            ];
            positions.sort((a, b) => Math.abs(a.pos - x) - Math.abs(b.pos - x));
            const choice = positions[0].key;
            if (choice === "shadow")      dragHandle(inputRailRef, setBlack, 0, 254)(e);
            else if (choice === "high")   dragHandle(inputRailRef, setWhite, 1, 255)(e);
            else                          dragHandle(inputRailRef, setGammaFromPos, 0, 255)(e);
          }
        },
          h("div", { className: "handle shadow",    style: { left: ((levels.inBlack / 255) * 100) + "%" } }),
          h("div", { className: "handle midtone",   style: { left: ((gammaPos / 255) * 100) + "%" } }),
          h("div", { className: "handle highlight", style: { left: ((levels.inWhite / 255) * 100) + "%" } })
        ),

        h("div", { className: "levels-values" },
          h("div", { className: "v" },
            h("span", { className: "lab" }, "Black"),
            h(NumberInput, { value: levels.inBlack, min: 0, max: 254, stepper: true, onChange: (v) => setBlack(v) })
          ),
          h("div", { className: "v" },
            h("span", { className: "lab" }, "Gamma"),
            h(NumberInput, { value: levels.gamma, min: 0.01, max: 9.99, step: 0.01, stepper: true,
              onChange: (v) => onChange(Object.assign({}, levels, { gamma: v })) })
          ),
          h("div", { className: "v" },
            h("span", { className: "lab" }, "White"),
            h(NumberInput, { value: levels.inWhite, min: 1, max: 255, stepper: true, onChange: (v) => setWhite(v) })
          )
        ),

        h("div", { className: "sublabel", style: { marginTop: 10 } }, "Output"),
        h("div", {
          className: "levels-output",
          ref: outputRailRef,
          onPointerDown: (e) => {
            const r = outputRailRef.current.getBoundingClientRect();
            const x = e.clientX - r.left;
            const sd = Math.abs((levels.outBlack / 255) * r.width - x);
            const hd = Math.abs((levels.outWhite / 255) * r.width - x);
            if (sd < hd) {
              dragHandle(outputRailRef,
                (v) => onChange(Object.assign({}, levels, { outBlack: Math.min(v, levels.outWhite - 1) })),
                0, 254)(e);
            } else {
              dragHandle(outputRailRef,
                (v) => onChange(Object.assign({}, levels, { outWhite: Math.max(v, levels.outBlack + 1) })),
                1, 255)(e);
            }
          }
        },
          h("div", { className: "handle out-shadow",    style: { left: ((levels.outBlack / 255) * 100) + "%" } }),
          h("div", { className: "handle out-highlight", style: { left: ((levels.outWhite / 255) * 100) + "%" } })
        ),
        h("div", { className: "levels-values", style: { gridTemplateColumns: "1fr 1fr" } },
          h("div", { className: "v" },
            h("span", { className: "lab" }, "Out black"),
            h(NumberInput, { value: levels.outBlack, min: 0, max: 254, stepper: true,
              onChange: (v) => onChange(Object.assign({}, levels, { outBlack: Math.min(v, levels.outWhite - 1) })) })
          ),
          h("div", { className: "v" },
            h("span", { className: "lab" }, "Out white"),
            h(NumberInput, { value: levels.outWhite, min: 1, max: 255, stepper: true,
              onChange: (v) => onChange(Object.assign({}, levels, { outWhite: Math.max(v, levels.outBlack + 1) })) })
          )
        )
      )
    );
  }

  /* Inline SVG icons ───────────────────────────────────────── */

  const Icon = {
    upload: h("svg", { className: "icon", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "1.7", strokeLinecap: "round", strokeLinejoin: "round" },

    ),

    ),

    ),

  /* Main app ────────────────────────────────────────────────── */

  function App() {
    const [image, setImage] = useState(null);
    const [settings, setSettings] = useState(DEFAULT_SETTINGS);
    const [preset, setPreset] = useState("Default");
    const [drag, setDrag] = useState(false);
    const [showOriginal, setShowOriginal] = useState(false);
    const [toast, setToast] = useState(null);
    const [cropMode, setCropMode] = useState(false);
    const [crop, setCrop] = useState(null);
    const [draftCrop, setDraftCrop] = useState(null);
    const [cropAspect, setCropAspect] = useState("free");
    const [perspectiveMode, setPerspectiveMode] = useState(false);
    const [draftQuad, setDraftQuad] = useState(null);
    const [perspectiveResult, setPerspectiveResult] = useState(null);
    const [processing, setProcessing] = useState(false);
    const fileInputRef = useRef(null);
    const canvasRef = useRef(null);
    const toastTimerRef = useRef(null);

    function showToast(msg, kind) {
      setToast({ msg, kind });
      clearTimeout(toastTimerRef.current);
      toastTimerRef.current = setTimeout(() => setToast(null), 1800);
    }

    const loadFile = useCallback((file) => {
      if (!file || !file.type.startsWith("image/")) {
        showToast("Please drop an image file", "error");
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const MAX = 4096;
        const origW = img.naturalWidth, origH = img.naturalHeight;
        let w = origW, hh = origH;
        const downscaled = Math.max(w, hh) > MAX;
        if (downscaled) {
          const s = MAX / Math.max(w, hh);
          w = Math.round(w * s); hh = Math.round(hh * s);
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = hh;
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, hh);
        const data = ctx.getImageData(0, 0, w, hh);
        setImage({ name: file.name || "image", width: w, height: hh, srcImageData: data });
        setCrop(null); setDraftCrop(null); setCropMode(false);
        setPerspectiveResult(null); setDraftQuad(null); setPerspectiveMode(false);
        URL.revokeObjectURL(url);
        if (downscaled) {
          showToast("Downscaled " + origW + "×" + origH + " → " + w + "×" + hh + " (max " + MAX + "px)");
        }
      };
      img.onerror = () => { showToast("Could not load that image", "error"); URL.revokeObjectURL(url); };
      img.src = url;
    }, []);

    useEffect(() => {
      const onDragOver = (e) => { e.preventDefault(); setDrag(true); };
      const onDragLeave = (e) => { if (e.target === document.body || e.relatedTarget === null) setDrag(false); };
      const onDrop = (e) => {
        e.preventDefault();
        setDrag(false);
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) loadFile(file);
      };
      const onPaste = (e) => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const it of items) {
          if (it.type && it.type.startsWith("image/")) {
            loadFile(it.getAsFile());
            break;
          }
        }
      };
      window.addEventListener("dragover", onDragOver);
      window.addEventListener("dragleave", onDragLeave);
      window.addEventListener("drop", onDrop);
      window.addEventListener("paste", onPaste);
      return () => {
        window.removeEventListener("dragover", onDragOver);
        window.removeEventListener("dragleave", onDragLeave);
        window.removeEventListener("drop", onDrop);
        window.removeEventListener("paste", onPaste);
      };
    }, [loadFile]);

    useEffect(() => {
      const onKey = (e) => {
        const target = e.target;
        const isField = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT");
        if (isField) return;
        if (cropMode) {
          if (e.key === "Enter") { e.preventDefault(); applyCrop(); return; }
          if (e.key === "Escape") { e.preventDefault(); cancelCrop(); return; }
        }
        if (perspectiveMode) {
          if (e.key === "Enter") { e.preventDefault(); applyPerspective(); return; }
          if (e.key === "Escape") { e.preventDefault(); cancelPerspective(); return; }
        }
        if (e.code === "Space") { e.preventDefault(); setShowOriginal(true); }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "c" && image && !window.getSelection().toString()) {
          e.preventDefault();
          copyToClipboard();
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && image) {
          e.preventDefault();
          downloadImage();
        }
        if (e.key === "i" && image && !cropMode && !perspectiveMode) setSettings((s) => Object.assign({}, s, { invert: !s.invert }));
      };
      const onUp = (e) => { if (e.code === "Space") setShowOriginal(false); };
      window.addEventListener("keydown", onKey);
      window.addEventListener("keyup", onUp);
      return () => {
        window.removeEventListener("keydown", onKey);
        window.removeEventListener("keyup", onUp);
      };
    }, [image, settings, cropMode, draftCrop, perspectiveMode, draftQuad]);

    const workingSrc = useMemo(() => {
      if (!image) return null;
      let base = image.srcImageData;
      if (perspectiveMode) return base;
      if (perspectiveResult) base = perspectiveResult;
      if (cropMode || !crop) return base;
      const { x, y, w, h } = crop;
      if (w <= 0 || h <= 0) return base;
      if (x + w > base.width || y + h > base.height) return base;
      const out = new ImageData(w, h);
      for (let row = 0; row < h; row++) {
        const srcStart = ((y + row) * base.width + x) * 4;
        out.data.set(base.data.subarray(srcStart, srcStart + w * 4), row * w * 4);
      }
      return out;
    }, [image, crop, cropMode, perspectiveResult, perspectiveMode]);

    const processedData = useMemo(() => {
      if (!workingSrc) return null;
      return processImage(workingSrc, settings);
    }, [workingSrc, settings]);

    const histogram = useMemo(() => {
      if (!processedData) return null;
      const hh = new Array(256).fill(0);
      const d = processedData.data;
      for (let i = 0; i < d.length; i += 4) hh[d[i]]++;
      return hh;
    }, [processedData]);

    useEffect(() => {
      if (!workingSrc) return;
      const c = canvasRef.current;
      if (!c) return;
      c.width = workingSrc.width;
      c.height = workingSrc.height;
      const ctx = c.getContext("2d");
      if (showOriginal) {
        ctx.putImageData(workingSrc, 0, 0);
      } else if (processedData) {
        ctx.putImageData(processedData, 0, 0);
      }
    }, [workingSrc, processedData, showOriginal]);

    function getExportBlob() {
      return new Promise((resolve) => {
        if (!processedData) { resolve(null); return; }
        const c = document.createElement("canvas");
        c.width = processedData.width;
        c.height = processedData.height;
        c.getContext("2d").putImageData(processedData, 0, 0);
        c.toBlob((blob) => resolve(blob), "image/png");
      });
    }
    async function downloadImage() {
      if (!image) return;
      const blob = await getExportBlob();
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      const base = (image.name || "image").replace(/\.[^.]+$/, "");
      a.href = url;
      a.download = base + "_alpha.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast("Downloaded " + a.download);
    }
    async function copyToClipboard() {
      if (!image) return;
      try {
        const blob = await getExportBlob();
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        showToast("Copied to clipboard");
      } catch (err) {
        showToast("Clipboard not available — try Download instead", "error");
      }
    }

    function enterPerspectiveMode() {
      if (!image) return;
      const w = image.srcImageData.width, h = image.srcImageData.height;
      const ix = w * 0.12, iy = h * 0.12;
      const seed = [
        { x: ix,     y: iy     },
        { x: w - ix, y: iy     },
        { x: w - ix, y: h - iy },
        { x: ix,     y: h - iy },
      ];
      setDraftQuad(seed);
      setPerspectiveMode(true);
      setCropMode(false);
    }
    function cancelPerspective() {
      setPerspectiveMode(false);
      setDraftQuad(null);
    }
    function applyPerspective() {
      if (!draftQuad || !image) return;
      const sz = quadOutSize(draftQuad);
      setProcessing(true);
      setTimeout(() => {
        const warped = warpPerspective(image.srcImageData, draftQuad, sz.w, sz.h);
        setProcessing(false);
        if (!warped) {
          showToast("Could not warp — quad is degenerate", "error");
          return;
        }
        setPerspectiveResult(warped);
        setCrop(null);
        setPerspectiveMode(false);
        setDraftQuad(null);
        showToast("Perspective applied (" + sz.w + "×" + sz.h + ")");
      }, 30);
    }
    function clearPerspective() {
      setPerspectiveResult(null);
      setDraftQuad(null);
      setPerspectiveMode(false);
    }

    function beginQuadDrag(idx, e) {
      if (!canvasRef.current || !image) return;
      e.preventDefault();
      e.stopPropagation();
      const rectEl = canvasRef.current.getBoundingClientRect();
      const srcW = image.srcImageData.width, srcH = image.srcImageData.height;
      const sx = srcW / rectEl.width, sy = srcH / rectEl.height;
      const move = (ev) => {
        const cx = clamp((ev.clientX - rectEl.left) * sx, 0, srcW);
        const cy = clamp((ev.clientY - rectEl.top) * sy, 0, srcH);
        setDraftQuad((q) => {
          if (!q) return q;
          const next = q.slice();
          next[idx] = { x: cx, y: cy };
          return next;
        });
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    }

    function enterCropMode() {
      setDraftCrop(crop);
      setCropMode(true);
      setPerspectiveMode(false);
    }
    function cancelCrop() {
      setCropMode(false);
      setDraftCrop(null);
    }
    function applyCrop() {
      if (draftCrop && draftCrop.w >= 2 && draftCrop.h >= 2) {
        setCrop(draftCrop);
      }
      setCropMode(false);
      setDraftCrop(null);
    }
    function clearCrop() {
      setCrop(null);
      setDraftCrop(null);
      setCropMode(false);
    }

    function beginCropDrag(e) {
      if (!cropMode || !canvasRef.current || !workingSrc) return;
      e.preventDefault();
      const rectEl = canvasRef.current.getBoundingClientRect();
      const srcW = workingSrc.width, srcH = workingSrc.height;
      const sx = srcW / rectEl.width, sy = srcH / rectEl.height;
      const startX = clamp((e.clientX - rectEl.left) * sx, 0, srcW);
      const startY = clamp((e.clientY - rectEl.top) * sy, 0, srcH);
      const update = (ev) => {
        let cx = clamp((ev.clientX - rectEl.left) * sx, 0, srcW);
        let cy = clamp((ev.clientY - rectEl.top) * sy, 0, srcH);
        let dx = cx - startX, dy = cy - startY;
        let aspect = cropAspect;
        if (ev.shiftKey) aspect = "1:1";
        const locked = aspect !== "free";
        if (locked) {
          const [aw, ah] = aspect.split(":").map(Number);
          const ratio = aw / ah;
          const adx = Math.abs(dx), ady = Math.abs(dy);
          if (adx === 0 && ady === 0) { dx = 0; dy = 0; }
          else if (adx / Math.max(ady, 0.0001) > ratio) {
            dy = (dy >= 0 ? 1 : -1) * adx / ratio;
          } else {
            dx = (dx >= 0 ? 1 : -1) * ady * ratio;
          }
          const maxAbsDx = dx >= 0 ? srcW - startX : startX;
          const maxAbsDy = dy >= 0 ? srcH - startY : startY;
          const adx2 = Math.abs(dx), ady2 = Math.abs(dy);
          if (adx2 > maxAbsDx || ady2 > maxAbsDy) {
            const scale = Math.min(
              adx2 > 0 ? maxAbsDx / adx2 : 1,
              ady2 > 0 ? maxAbsDy / ady2 : 1
            );
            dx *= scale;
            dy *= scale;
          }
        }
        let x = Math.min(startX, startX + dx);
        let y = Math.min(startY, startY + dy);
        let w = Math.abs(dx);
        let hh = Math.abs(dy);
        if (!locked) {
          if (x < 0) { w += x; x = 0; }
          if (y < 0) { hh += y; y = 0; }
          if (x + w > srcW) w = srcW - x;
          if (y + hh > srcH) hh = srcH - y;
        }
        setDraftCrop({ x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(hh) });
      };
      update(e);
      const up = () => {
        window.removeEventListener("pointermove", update);
        window.removeEventListener("pointerup", up);
      };
      window.addEventListener("pointermove", update);
      window.addEventListener("pointerup", up);
    }

    function resetAll() {
      setSettings(DEFAULT_SETTINGS);
      setPreset("Default");
    }
    function resetBW() {
      setSettings((s) => Object.assign({}, s, { bw: Object.assign({}, DEFAULT_BW) }));
      setPreset("Default");
    }
    function resetLevels() {
      setSettings((s) => Object.assign({}, s, { levels: Object.assign({}, DEFAULT_LEVELS) }));
    }
    function resetBC() {
      setSettings((s) => Object.assign({}, s, { bc: Object.assign({}, DEFAULT_BC) }));
    }
    function applyPreset(name) {
      setPreset(name);
      setSettings((s) => Object.assign({}, s, { bw: Object.assign({}, BW_PRESETS[name]) }));
    }

    const hasImage = !!image;

    return h("div", { className: "app" },
      h("header", null,
        h("div", { className: "brand" },
          h("div", { className: "brand-mark" }),
          h("span", null, "Levels"),
          h("span", { className: "brand-sub" }, "— texture alpha studio")
        ),
        h("div", { className: "header-actions" },
          h("input", {
            ref: fileInputRef,
            className: "file-input",
            type: "file",
            accept: "image/*",
            onChange: (e) => e.target.files && e.target.files[0] && loadFile(e.target.files[0]),
          }),
          h("button", { className: "btn", onClick: () => fileInputRef.current.click() },
            Icon.upload, " Open image"
          ),
          h("button", { className: "btn", onClick: resetAll, disabled: !hasImage },
            Icon.reset, " Reset"
          ),
          h("button", { className: "btn", onClick: copyToClipboard, disabled: !hasImage },
            Icon.copy, " Copy ", h("span", { className: "kbd" }, "⌘C")
          ),
          h("button", { className: "btn primary", onClick: downloadImage, disabled: !hasImage },
            Icon.download, " Download ", h("span", { className: "kbd" }, "⌘S")
          )
        )
      ),

      h("div", { className: "stage" },
        hasImage && h("div", { className: "canvas-wrap" },
          h("canvas", { ref: canvasRef, className: (workingSrc && workingSrc.width < 1000) ? "" : "fit-smooth" }),
          cropMode && h("div", {
            className: "crop-overlay",
            onPointerDown: beginCropDrag,
          },
            draftCrop && draftCrop.w > 0 && draftCrop.h > 0
              ? h("div", {
                  className: "crop-rect",
                  style: {
                    left: (draftCrop.x / workingSrc.width) * 100 + "%",
                    top: (draftCrop.y / workingSrc.height) * 100 + "%",
                    width: (draftCrop.w / workingSrc.width) * 100 + "%",
                    height: (draftCrop.h / workingSrc.height) * 100 + "%",
                  },
                })
              : h("div", { className: "crop-rect empty", style: { left: 0, top: 0, width: "100%", height: "100%" } },
                  h("span", { className: "crop-empty-msg" }, "Drag to define a crop")
                )
          ),
          perspectiveMode && draftQuad && h("div", { className: "perspective-overlay" },
            h("svg", {
              className: "perspective-svg",
              viewBox: "0 0 " + image.srcImageData.width + " " + image.srcImageData.height,
              preserveAspectRatio: "none",
            },
              h("polygon", {
                points: draftQuad.map((p) => p.x + "," + p.y).join(" "),
                fill: "oklch(0.78 0.13 65 / 0.08)",
                stroke: "oklch(0.96 0.004 80)",
                strokeWidth: 1,
                vectorEffect: "non-scaling-stroke",
              })
            ),
            draftQuad.map((p, i) =>
              h("div", {
                key: i,
                className: "quad-handle",
                style: {
                  left: (p.x / image.srcImageData.width) * 100 + "%",
                  top: (p.y / image.srcImageData.height) * 100 + "%",
                },
                onPointerDown: (e) => beginQuadDrag(i, e),
                title: ["Top-left", "Top-right", "Bottom-right", "Bottom-left"][i],
              })
            )
          ),
          processing && h("div", { className: "stage-processing" },
            h("div", { className: "stage-processing-inner" }, "Warping…")
          )
        ),
        hasImage && h("div", { className: "stage-overlay" },
          h("span", { className: "chip" }, image.name),
          h("span", { className: "chip" }, (workingSrc ? workingSrc.width : image.width) + " × " + (workingSrc ? workingSrc.height : image.height)),
          perspectiveResult && !perspectiveMode && h("span", { className: "chip", style: { color: "var(--accent)" } }, "warped"),
          crop && !cropMode && h("span", { className: "chip", style: { color: "var(--accent)" } }, "cropped"),
          settings.invert && h("span", { className: "chip", style: { color: "var(--accent)" } }, "inverted")
        ),
        hasImage && !cropMode && !perspectiveMode && h("div", { className: "stage-controls" },
          h("button", {
            className: "toggle-btn" + (showOriginal ? " held" : ""),
            onMouseDown: () => setShowOriginal(true),
            onMouseUp: () => setShowOriginal(false),
            onMouseLeave: () => setShowOriginal(false),
            title: "Hold to compare with original",
          }, Icon.eye, " ", showOriginal ? "Original" : "Hold to compare"),
          h("button", {
            className: "toggle-btn",
            onClick: enterCropMode,
            title: "Crop image",
          }, Icon.crop, " Crop"),
          h("button", {
            className: "toggle-btn",
            onClick: enterPerspectiveMode,
            title: "Perspective crop — drag 4 corners",
          }, Icon.perspective, " Perspective"),
          crop && h("button", {
            className: "toggle-btn",
            onClick: clearCrop,
            title: "Reset crop to full frame",
          }, Icon.reset, " Reset crop"),
          perspectiveResult && h("button", {
            className: "toggle-btn",
            onClick: clearPerspective,
            title: "Reset perspective",
          }, Icon.reset, " Reset persp."),
          h("button", {
            className: "toggle-btn" + (settings.invert ? " on" : ""),
            onClick: () => setSettings((s) => Object.assign({}, s, { invert: !s.invert })),
            title: "Invert (I)",
          }, Icon.invert, " Invert")
        ),
        hasImage && perspectiveMode && h("div", { className: "stage-controls" },
          h("span", { style: { color: "var(--fg-2)", fontSize: 12, padding: "0 6px" } },
            "Drag corners to align with target rectangle"
          ),
          h("button", {
            className: "toggle-btn",
            onClick: cancelPerspective,
            title: "Cancel (Esc)",
          }, Icon.close, " Cancel"),
          h("button", {
            className: "toggle-btn on",
            onClick: applyPerspective,
            title: "Apply (Enter)",
          }, Icon.check, " Apply")
        ),
        hasImage && cropMode && h("div", { className: "stage-controls" },
          h("select", {
            className: "aspect-select",
            value: cropAspect,
            onChange: (e) => setCropAspect(e.target.value),
            title: "Aspect ratio (Shift while dragging = 1:1)",
          },
            h("option", { value: "free" }, "Free"),
            h("option", { value: "1:1" }, "1:1"),
            h("option", { value: "4:5" }, "4:5"),
            h("option", { value: "5:4" }, "5:4"),
            h("option", { value: "16:9" }, "16:9"),
            h("option", { value: "9:16" }, "9:16"),
            h("option", { value: "3:2" }, "3:2"),
            h("option", { value: "2:3" }, "2:3")
          ),
          h("button", {
            className: "toggle-btn",
            onClick: cancelCrop,
            title: "Cancel (Esc)",
          }, Icon.close, " Cancel"),
          h("button", {
            className: "toggle-btn on",
            onClick: applyCrop,
            title: "Apply (Enter)",
          }, Icon.check, " Apply")
        ),
        !hasImage && h("div", { className: "empty" + (drag ? " drag" : "") },
          h("div", { className: "glyph" }, Icon.image),
          h("h2", null, "Drop an image to start"),
          h("p", null, "Or paste from clipboard, or open a file."),
          h("div", { className: "actions" },
            h("button", { className: "btn primary", onClick: () => fileInputRef.current.click() },
              Icon.upload, " Choose image"
            )
          ),
          h("span", { className: "hint" }, "Photos, screenshots, scans, any RGB image — JPEG · PNG · WebP")
        )
      ),

      h("aside", null,
        h(BWMixer, {
          bw: settings.bw,
          bwOn: settings.bwOn,
          onChange: (bw) => { setSettings((s) => Object.assign({}, s, { bw })); setPreset(""); },
          onToggle: (v) => setSettings((s) => Object.assign({}, s, { bwOn: v })),
          onReset: resetBW,
          preset,
          onPreset: applyPreset,
        }),
        h(BCPanel, {
          bc: settings.bc,
          onChange: (bc) => setSettings((s) => Object.assign({}, s, { bc })),
          onReset: resetBC,
        }),
        h(LevelsPanel, {
          levels: settings.levels,
          onChange: (levels) => setSettings((s) => Object.assign({}, s, { levels })),
          onReset: resetLevels,
          histogram,
        }),
        h("section", { className: "panel", style: { borderBottom: 0, marginTop: "auto" } },
          h("div", { className: "panel-body", style: { paddingTop: 14 } },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
              h("span", { style: { color: "var(--fg-3)", fontSize: 11.5 } }, "Shortcuts")
            ),
            h("div", { className: "mono", style: { fontSize: 11, color: "var(--fg-3)", lineHeight: 1.7 } },
              h("div", null, h("span", { style: { color: "var(--fg-2)" } }, "Space"), "   hold to compare original"),
              h("div", null, h("span", { style: { color: "var(--fg-2)" } }, "I"), "      toggle invert"),
              h("div", null,
                h("span", { style: { color: "var(--fg-2)" } }, "⌘ C"), "   copy result · ",
                h("span", { style: { color: "var(--fg-2)" } }, "⌘ S"), " download"
              ),
              h("div", null, h("span", { style: { color: "var(--fg-2)" } }, "2×click"), " slider → reset to default")
            )
          )
        )
      ),

      toast && h("div", { className: "toast show" + (toast.kind === "error" ? " error" : "") }, toast.msg)
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
